{% extends "base.html" %}
{% block title %}Reset password{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="card">
    <h1>Reset your password</h1>
    <p class="sub">We will email you a verification code.</p>

    {% if step == 'email' %}
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="form_action" value="send_code">

        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" value="{{ email }}" required autofocus autocomplete="email">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Send code</button>
      </form>
    {% else %}
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="form_action" value="reset">
        <input type="hidden" name="email" value="{{ email }}">

        <p class="small muted">Enter the code we sent to <strong>{{ email }}</strong>.</p>

        <div class="field">
          <label for="otp_code">Verification code</label>
          <input type="text" id="otp_code" name="otp_code" inputmode="numeric" maxlength="6"
                 required autofocus autocomplete="one-time-code" placeholder="000000">
        </div>

        <div class="field">
          <label for="password1">New password</label>
          <input type="password" id="password1" name="password1" required minlength="8" autocomplete="new-password">
          <span class="small muted">At least 8 characters.</span>
        </div>

        <div class="field">
          <label for="password2">Confirm new password</label>
          <input type="password" id="password2" name="password2" required minlength="8" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Reset password</button>
      </form>
    {% endif %}

    <p class="center small mt-4"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
  </div>
</div>
{% endblock %}
