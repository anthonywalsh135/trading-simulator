{% extends "base.html" %}
{% block title %}Log in{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="card">
    <h1>Log in</h1>
    <p class="sub">Welcome back to the trading simulator.</p>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autofocus autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>

      <label style="display:flex; align-items:center; gap:8px; font-weight:400; margin-bottom:var(--space-4)">
        <input type="checkbox" name="remember" style="width:auto" checked>
        <span>Keep me logged in</span>
      </label>

      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="center small mt-4">
      <a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a>
    </p>
    <p class="center small">
      No account? <a href="{{ url_for('auth.signup') }}">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}
